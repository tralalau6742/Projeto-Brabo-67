```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de DOM e JS</title>

    <style>
        /* 4. Texto oculto */
        #oculto {
            display: none;
        }

        /* 6. Caixas */
        .caixa {
            width: 50px;
            height: 50px;
            background-color: lightgray;
            margin: 5px;
        }
    </style>
</head>

<body>

    <!-- 1. Alterar Título -->
    <h1 id="titulo">Título Original</h1>


    <!-- 2. Trocar a Cor de um Parágrafo -->
    <p class="destaque">Este parágrafo vai ficar azul.</p>


    <!-- 3. Alterar Múltiplos Elementos -->
    <ul>
        <li class="item">Item 1</li>
        <li class="item">Item 2</li>
        <li class="item">Item 3</li>
    </ul>


    <!-- 4. Mostrar Texto Oculto -->
    <p id="oculto">Este texto estava escondido!</p>
    <button id="btnMostrar">Mostrar Texto</button>


    <br><br>


    <!-- 5. Atualizar Texto com Input -->
    <input type="text" id="entrada" placeholder="Digite algo">
    <button id="btnAtualizar">Atualizar Texto</button>

    <p id="resultado">O texto aparecerá aqui.</p>


    <!-- 6. Contar Elementos -->
    <div class="caixa"></div>
    <div class="caixa"></div>
    <div class="caixa"></div>
    <div class="caixa"></div>
    <div class="caixa"></div>


    <!-- 7. Mudar Imagem -->
    <img id="foto" src="https://via.placeholder.com/150" alt="Imagem">

    <br>

    <button id="btnImagem">Mudar Imagem</button>


    <br><br>


    <!-- 8. Alterar Estilo com Classe -->
    <button class="botao-estiloso">Botão Estiloso</button>


    <!-- 9. Selecionar com ID e Mudar Texto -->
    <p id="mensagem">Texto antigo.</p>


    <!-- 10. Iterar sobre Vários Elementos -->
    <p class="comentario">Primeiro comentário</p>
    <p class="comentario">Segundo comentário</p>
    <p class="comentario">Terceiro comentário</p>


    <script>

        // 1. Alterar Título
        let titulo = document.getElementById("titulo");
        titulo.innerText = "Olá, Mundo!";


        // 2. Trocar a Cor de um Parágrafo
        let destaque = document.querySelector(".destaque");
        destaque.style.color = "blue";


        // 3. Alterar Múltiplos Elementos
        let itens = document.querySelectorAll(".item");

        for (let i = 0; i < itens.length; i++) {
            itens[i].innerText = "Item modificado";
        }


        // 4. Mostrar Texto Oculto
        let btnMostrar = document.getElementById("btnMostrar");

        btnMostrar.onclick = function() {
            let oculto = document.getElementById("oculto");
            oculto.style.display = "block";
        };


        // 5. Atualizar Texto com Input
        let btnAtualizar = document.getElementById("btnAtualizar");

        btnAtualizar.onclick = function() {
            let entrada = document.getElementById("entrada");
            let resultado = document.getElementById("resultado");

            resultado.innerText = entrada.value;
        };


        // 6. Contar Elementos
        let caixas = document.querySelectorAll(".caixa");

        console.log("Quantidade de caixas:", caixas.length);


        // 7. Mudar Imagem
        let btnImagem = document.getElementById("btnImagem");

        btnImagem.onclick = function() {
            let foto = document.getElementById("foto");

            foto.src = "https://via.placeholder.com/150/0000FF/FFFFFF";
        };


        // 8. Alterar Estilo com Classe
        let botao = document.querySelector(".botao-estiloso");

        botao.style.backgroundColor = "green";
        botao.style.color = "white";
        botao.style.borderRadius = "10px";
        botao.style.padding = "10px";


        // 9. Selecionar com ID e Mudar Texto
        let mensagem = document.getElementById("mensagem");

        mensagem.innerText = "Texto alterado com sucesso!";


        // 10. Iterar sobre Vários Elementos
        let comentarios = document.querySelectorAll(".comentario");

        comentarios.forEach(function(comentario) {
            comentario.innerText = "Comentário: " + comentario.innerText;
        });

    </script>

</body>
</html>
```
